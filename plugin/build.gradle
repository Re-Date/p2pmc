plugins {
    id 'java'
}

group = 'dev.p2pmc'
version = project.plugin_version

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${project.paper_version}"
}

// The P2P engine is plain JDK Java in ../core and is compiled straight into the plugin jar (no shading needed).
sourceSets {
    main {
        java {
            srcDir '../core/src/main/java'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // 1.21.x servers run Java 21, 26.x servers Java 25
    options.release = project.java_release.toInteger()
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'api_version', project.api_version
    filesMatching('plugin.yml') {
        expand 'version': project.version, 'api_version': project.api_version
    }
}

jar {
    archiveBaseName = 'P2PMinecraft'
}
