plugins {
    // Minecraft 26.1+ is unobfuscated: non-remapping Loom, no mappings line, plain "implementation" for loader.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Gson and SLF4J come with Minecraft. Fabric API is NOT required.
}

// The P2P engine is plain JDK Java, kept in ../core so it can be tested without Minecraft. It is compiled into the mod jar.
sourceSets {
    main {
        java {
            srcDir '../core/src/main/java'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_range', project.mcRange
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'mc_range': project.mcRange
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
