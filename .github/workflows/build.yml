name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Engine self-tests
        run: |
          javac --release 21 -d out $(find core/src -name '*.java')
          java -cp out dev.p2pmc.crypto.CryptoSelfTest
          java -cp out dev.p2pmc.net.TransportSelfTest
          java -cp out dev.p2pmc.net.EndToEndSelfTest

      - name: Build Paper plugin
        run: gradle -p plugin build --no-daemon

      - name: Build Fabric mod
        id: mod
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build --no-daemon --stacktrace 2>&1 | tee mod-build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2pmc-jars
          if-no-files-found: ignore
          path: |
            plugin/build/libs/*.jar
            mod/build/libs/*.jar

      - name: Publish jars to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="$(ls plugin/build/libs/*.jar mod/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' || true)"
          echo "$FILES"
          if [ -n "$FILES" ]; then
            gh release create "build-${{ github.run_number }}" $FILES \
              --title "Build ${{ github.run_number }}" \
              --notes "Automated build (mod: ${{ steps.mod.outcome }})."
          fi

      - name: Probe Minecraft API (debug aid)
        if: always()
        continue-on-error: true
        run: bash scripts/probe.sh

      - name: Save mod build log to branch 'buildlog'
        if: always()
        run: |
          mkdir -p /tmp/logs
          if [ -f mod-build.log ]; then tail -n 400 mod-build.log > /tmp/logs/mod-build.log; fi
          echo "mod=${{ steps.mod.outcome }} run=${{ github.run_number }}" > /tmp/logs/status.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/logs/* .
          git add .
          git commit -q -m "build log for run ${{ github.run_number }}"
          git push -f origin buildlog

      - name: Fail if the mod did not build
        if: steps.mod.outcome == 'failure'
        run: exit 1
