name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Engine self-tests
        run: |
          javac --release 21 -d out $(find core/src -name '*.java')
          java -cp out dev.p2pmc.crypto.CryptoSelfTest
          java -cp out dev.p2pmc.net.TransportSelfTest
          java -cp out dev.p2pmc.net.EndToEndSelfTest
          java -cp out dev.p2pmc.net.DiscordSelfTest

      - name: Build Paper plugin
        run: gradle -p plugin build --no-daemon

      - name: Build Fabric mod
        id: mod
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build --no-daemon --stacktrace 2>&1 | tee mod-build.log

      - name: Build NeoForge mod (Minecraft 1.21.1)
        id: neo
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p neoforge build --no-daemon --stacktrace 2>&1 | tee neoforge-build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2pmc-jars
          if-no-files-found: ignore
          path: |
            plugin/build/libs/*.jar
            mod/build/libs/*.jar
            neoforge/build/libs/*.jar

      - name: Publish jars to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          MOD="$(ls mod/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 || true)"
          PLUGIN="$(ls plugin/build/libs/*.jar 2>/dev/null | head -1 || true)"
          mkdir -p release
          ARGS=()
          NOTES="Build $N"$'\n'
          if [ -n "$MOD" ]; then
            cp "$MOD" "release/MOD-fabric-client-build$N.jar"
            ARGS+=("release/MOD-fabric-client-build$N.jar")
            NOTES+="- MOD-fabric-client-build$N.jar: Fabric mod for players (.minecraft/mods)"$'\n'
          fi
          NEO="$(ls neoforge/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 || true)"
          if [ -n "$NEO" ]; then
            cp "$NEO" "release/MOD-neoforge-1.21.1-client-build$N.jar"
            ARGS+=("release/MOD-neoforge-1.21.1-client-build$N.jar")
            NOTES+="- MOD-neoforge-1.21.1-client-build$N.jar: NeoForge 21.1.x mod for players on Minecraft 1.21.1 (mods/)"$'\n'
          fi
          if [ -n "$PLUGIN" ]; then
            cp "$PLUGIN" "release/PLUGIN-paper-server-build$N.jar"
            ARGS+=("release/PLUGIN-paper-server-build$N.jar")
            NOTES+="- PLUGIN-paper-server-build$N.jar: Paper server plugin (plugins/)"$'\n'
          fi
          if [ ${#ARGS[@]} -gt 0 ]; then
            gh release create "build-$N" "${ARGS[@]}" --title "Build $N" --notes "$NOTES"
          fi

      - name: Probe Minecraft API (debug aid)
        if: always()
        continue-on-error: true
        run: bash scripts/probe.sh

      - name: Probe NeoForge API (debug aid)
        if: always()
        continue-on-error: true
        run: bash scripts/probe-neoforge.sh

      - name: Save mod build log to branch 'buildlog'
        if: always()
        run: |
          mkdir -p /tmp/logs
          if [ -f mod-build.log ]; then tail -n 400 mod-build.log > /tmp/logs/mod-build.log; fi
          if [ -f neoforge-build.log ]; then tail -n 400 neoforge-build.log > /tmp/logs/neoforge-build.log; fi
          echo "mod=${{ steps.mod.outcome }} run=${{ github.run_number }}" > /tmp/logs/status.txt
          echo "neoforge=${{ steps.neo.outcome }}" >> /tmp/logs/status.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/logs/* .
          git add .
          git commit -q -m "build log for run ${{ github.run_number }}"
          git push -f origin buildlog

      - name: Fail if the mod did not build
        if: steps.mod.outcome == 'failure' || steps.neo.outcome == 'failure'
        run: exit 1
