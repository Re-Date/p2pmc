name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Engine self-tests
        run: |
          javac --release 21 -d out $(find core/src -name '*.java')
          java -cp out dev.p2pmc.crypto.CryptoSelfTest
          java -cp out dev.p2pmc.net.TransportSelfTest
          java -cp out dev.p2pmc.net.EndToEndSelfTest
          java -cp out dev.p2pmc.net.DiscordSelfTest

      - name: Build Paper plugin
        run: gradle -p plugin build --no-daemon

      - name: Build Fabric mod
        id: mod
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p mod build --no-daemon --stacktrace 2>&1 | tee mod-build.log

      - name: Build NeoForge mod (Minecraft 1.21.1)
        id: neo
        continue-on-error: true
        run: |
          set -o pipefail
          gradle -p neoforge build --no-daemon --stacktrace 2>&1 | tee neoforge-build.log

      - name: Build other Minecraft versions (Fabric 1.21.1 / 1.21.4, NeoForge 1.21.4)
        id: variants
        continue-on-error: true
        run: |
          mkdir -p release variants
          : > variants/status.txt
          N="${{ github.run_number }}"
          # keep the jars built above: the variant builds below clean their build folders
          MAIN_MOD="$(ls mod/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 || true)"
          MAIN_NEO="$(ls neoforge/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | head -1 || true)"
          if [ -n "$MAIN_MOD" ]; then cp "$MAIN_MOD" "release/MOD-fabric-26.3-client-build$N.jar"; fi
          if [ -n "$MAIN_NEO" ]; then cp "$MAIN_NEO" "release/MOD-neoforge-1.21.1-client-build$N.jar"; fi
          build() { # name  jar-glob-dir  gradle-args...
            local name="$1" dir="$2"; shift 2
            if gradle "$@" clean build --no-daemon > "variants/$name.log" 2>&1; then
              local jar; jar="$(ls $dir/build/libs/*.jar | grep -vE -- '-(sources|dev)\.jar$' | head -1)"
              cp "$jar" "release/$name-build${{ github.run_number }}.jar"
              echo "$name ok" >> variants/status.txt
            else
              echo "$name FAILED" >> variants/status.txt
              tail -n 120 "variants/$name.log" > "variants/$name.tail"
            fi
          }
          build MOD-fabric-26.1.2-client mod -p mod -Pminecraft_version=26.1.2 '-PmcRange=~26.1.2'
          build MOD-fabric-26.2-client mod -p mod -Pminecraft_version=26.2 '-PmcRange=~26.2'
          build MOD-fabric-1.21.1-client fabric-legacy -p fabric-legacy -Pmc=1.21.1 '-PmcRange=~1.21.1'
          build MOD-fabric-1.21.4-client fabric-legacy -p fabric-legacy -Pmc=1.21.4 '-PmcRange=~1.21.4'
          NEO4="$(curl -fsS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE '<version>21\.4\.[0-9]+</version>' | sed -E 's/<[^>]+>//g' | sort -t. -k3 -n | tail -1)"
          echo "NeoForge for 1.21.4: $NEO4" | tee -a variants/status.txt
          build MOD-neoforge-1.21.4-client neoforge -p neoforge -Pminecraft_version=1.21.4 "-Pneo_version=$NEO4" '-PmcRange=[1.21.4,1.21.5)'
          MDG="$(curl -fsS https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -oE '<release>[^<]+' | sed 's/<release>//')"
          echo "ModDevGradle: $MDG" | tee -a variants/status.txt
          for MC in 26.1.2 26.2 26.3; do
            NEO26="$(curl -fsS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>${MC//./\\.}\\.[^<]+</version>" | sed -E 's/<[^>]+>//g' | tail -1)"
            echo "NeoForge for $MC: $NEO26" | tee -a variants/status.txt
            case "$MC" in 26.1.2) RANGE='[26.1.2,26.2)';; 26.2) RANGE='[26.2,26.3)';; *) RANGE='[26.3,26.4)';; esac
            build "MOD-neoforge-$MC-client" neoforge-26 -p neoforge-26 "-Pminecraft_version=$MC" "-Pneo_version=$NEO26" "-PmcRange=$RANGE" "-Pmdg_version=$MDG"
          done
          cat variants/status.txt
          ! grep -q FAILED variants/status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2pmc-jars
          if-no-files-found: ignore
          path: |
            plugin/build/libs/*.jar
            mod/build/libs/*.jar
            neoforge/build/libs/*.jar

      - name: Publish jars to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="${{ github.run_number }}"
          PLUGIN="$(ls plugin/build/libs/*.jar 2>/dev/null | head -1 || true)"
          mkdir -p release
          if [ -n "$PLUGIN" ]; then cp "$PLUGIN" "release/PLUGIN-paper-server-build$N.jar"; fi
          ARGS=()
          NOTES="Build $N"$'\n'
          for f in release/*.jar; do
            [ -f "$f" ] || continue
            ARGS+=("$f")
            NOTES+="- $(basename "$f")"$'\n'
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            gh release create "build-$N" "${ARGS[@]}" --title "Build $N" --notes "$NOTES"
          fi

      - name: Probe Minecraft API (debug aid)
        if: always()
        continue-on-error: true
        run: bash scripts/probe.sh

      - name: Probe NeoForge API (debug aid)
        if: always()
        continue-on-error: true
        run: bash scripts/probe-neoforge.sh

      - name: Save mod build log to branch 'buildlog'
        if: always()
        run: |
          mkdir -p /tmp/logs
          if [ -f mod-build.log ]; then tail -n 400 mod-build.log > /tmp/logs/mod-build.log; fi
          if [ -f neoforge-build.log ]; then tail -n 400 neoforge-build.log > /tmp/logs/neoforge-build.log; fi
          echo "mod=${{ steps.mod.outcome }} run=${{ github.run_number }}" > /tmp/logs/status.txt
          echo "neoforge=${{ steps.neo.outcome }}" >> /tmp/logs/status.txt
          if [ -f variants/status.txt ]; then cat variants/status.txt >> /tmp/logs/status.txt; cp variants/*.tail /tmp/logs/ 2>/dev/null || true; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/logs/* .
          git add .
          git commit -q -m "build log for run ${{ github.run_number }}"
          git push -f origin buildlog

      - name: Fail if the mod did not build
        if: steps.mod.outcome == 'failure' || steps.neo.outcome == 'failure' || steps.variants.outcome == 'failure'
        run: exit 1
