name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Engine self-tests
        run: |
          javac --release 21 -d out $(find core/src -name '*.java')
          java -cp out dev.p2pmc.crypto.CryptoSelfTest
          java -cp out dev.p2pmc.net.TransportSelfTest
          java -cp out dev.p2pmc.net.EndToEndSelfTest

      - name: Build Paper plugin
        run: gradle -p plugin build --no-daemon

      - name: Build Fabric mod
        run: gradle -p mod build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: p2pmc-jars
          path: |
            plugin/build/libs/*.jar
            mod/build/libs/*.jar

      - name: Publish jars to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="$(ls plugin/build/libs/*.jar mod/build/libs/*.jar | grep -v -- '-sources')"
          echo "$FILES"
          gh release create "build-${{ github.run_number }}" $FILES \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build of the Fabric mod and the Paper plugin."
